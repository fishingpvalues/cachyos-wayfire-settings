[background]
cycle_timeout = 150
image = /usr/share/wallpapers/cachyos-wallpapers/Liquid.png
preserve_aspect = false
randomize = false

[dock]
autohide_duration = 300
css_path = ~/.config/wf-shell/dock.css
position = bottom
# Enhanced dock settings for Mac-style appearance
autohide = true
dock_size = 48
dock_spacing = 8
dock_margin = 20
dock_rounded = true
dock_background = rgba(0, 0, 0, 0.3)
dock_border = rgba(255, 255, 255, 0.1)

[panel]
autohide = false
autohide_duration = 300
background_color = rgba(0, 0, 0, 0.8)
battery_font = Fira Sans
battery_icon_invert = false
battery_icon_size = 32
battery_status = 1
clock_font = Fira Sans
clock_format = %a %e %b %Y %I:%M %p
css_path = ~/.config/wf-shell/panel.css
# Enhanced launchers for modern workflow
launcher_000menu = cachyos-menu.desktop
# launcher_1cachyos-hello = cachyos-hello.desktop  # Disabled due to hanging issues
launcher_1cachyos-hello = wofi --show drun  # Alternative menu
launcher_alacritty = Alacritty.desktop
launcher_blueberry = blueberry.desktop
launcher_connman-gtk = connman-gtk.desktop
launcher_cachy-browser = cachy-browser.desktop
launcher_pavucontrol-qt = pavucontrol.desktop
launcher_timeshift = timeshift-gtk.desktop
launcher_wayfire = wayfire-config-manager.desktop
launcher_wdisplay = network.cycles.wdisplays.desktop
launcher_wf-osk = wf-osk.desktop
# Additional modern launchers
launcher_nvim = nvim.desktop
launcher_thunar = Thunar.desktop
launcher_spotify = spotify.desktop
launcher_discord = Discord.desktop
launcher_telegram = org.telegram.desktop.desktop
launchers_size = 40
launchers_spacing = 6
layer = top
menu_fuzzy_search = true
menu_icon = /usr/share/icons/cachyos/cachyos-start.svg
menu_logout_command = wlogout
minimal_height = 20
network_icon_invert_color = false
network_icon_size = 32
network_status = 1
network_status_font = Fira Sans
network_status_use_color = false
position = bottom
volume_display_timeout = 2.500000
widgets_center =
widgets_left = launchers  window-list
widgets_right = battery volume clock

