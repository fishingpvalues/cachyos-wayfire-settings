[alpha]
min_value = 0.100000
modifier = <alt> <super>

[animate]
close_animation = fade
duration = 250
enabled_for = (type equals "toplevel" | (type equals "x-or" & focusable equals true) | type equals "overlay")
fade_duration = 250
fade_enabled_for = type equals "overlay" | title is toplevel
fire_duration = 150
fire_enabled_for = none
fire_particle_size = 16.000000
fire_particles = 2000
open_animation = fade
startup_duration = 300
zoom_duration = 400
zoom_enabled_for = none

[annotate]
clear_workspace = <alt> <super> KEY_C
draw = <alt> <super> BTN_LEFT
from_center = true
line_width = 3.000000
method = draw
stroke_color = \#FF0000FF

[autorotate-iio]
lock_rotation = false
rotate_down = <ctrl> <super> KEY_DOWN
rotate_left = <ctrl> <super> KEY_LEFT
rotate_right = <ctrl> <super> KEY_RIGHT
rotate_up = <ctrl> <super> KEY_UP

[autostart]
# Import environment variables to prevent long loading times
import-environment = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Core system services
autostart_wf_shell = true
# Explicitly start wf-dock (fixes autostart_wf_shell bug)
dock = wf-dock
background = wf-background
panel = wf-panel

# Essential system services with proper delays
gnome-keyring = sleep 1 && gnome-keyring-daemon --daemonize --start --components=gpg,pkcs11,secrets,ssh
polkit-gnome = sleep 1 && /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
portal = sleep 1 && /usr/libexec/xdg-desktop-portal

# Network and notifications
nm = sleep 2 && nm-applet --indicator
notifications = sleep 2 && mako

# Output management
outputs = sleep 1 && kanshi

# System utilities
idle = sleep 2 && swayidle -w before-sleep swaylock
gammastep = sleep 1 && gammastep

# Clipboard management
clipman-restore = sleep 1 && clipman restore
clipman-store = sleep 1 && wl-paste -t text --watch clipman store

# Desktop integration
dex = sleep 2 && dex -a -s /etc/xdg/autostart/:~/.config/autostart/

# SOTA Enhanced autostart for modern setup
waybar = sleep 2 && waybar
wofi = sleep 1 && wofi --show drun

# WezTerm as default terminal (no autostart, launch on demand)
# wezterm = wezterm start

# Modern file manager (no autostart, launch on demand)
# thunar = thunar --daemon

# System monitoring (no autostart, launch on demand)
# btop = btop

# [background-view]
# command = mpv --loop=inf
# file =
# Note: Disabled to prevent crashes and performance issues

[bench]
average_frames = 1
frames_per_update = 3
position = top_center

[blur]
blur_by_default = type is "toplevel"
bokeh_degrade = 1
bokeh_iterations = 8
bokeh_offset = 8.000000
box_degrade = 1
box_iterations = 2
box_offset = 3.000000
gaussian_degrade = 1
gaussian_iterations = 2
gaussian_offset = 3.000000
kawase_degrade = 1
kawase_iterations = 2
kawase_offset = 8.000000
method = kawase
mode = normal
saturation = 1.100000
toggle = <super> KEY_B

[command]
# SOTA Enhanced vim-style keybindings with WezTerm integration
binding_terminal = <super> KEY_ENTER | <super> KEY_T
binding_launcher = <super> KEY_D | <super> KEY_SPACE
binding_browser = <super> KEY_W
binding_filemanager = <super> KEY_N
binding_editor = <super> KEY_E
binding_lock = <super> <shift> KEY_ESC
binding_logout = <super> KEY_ESC
binding_media-play-pause = KEY_PLAYPAUSE
binding_media-stop = KEY_STOPCD
binding_mute = KEY_MUTE
binding_screenshot = KEY_SYSRQ | KEY_PRINT
binding_screenshot_interactive = <shift> KEY_SYSRQ | <shift> KEY_PRINT | <super> <shift> KEY_P
binding_clipman = <super> KEY_H
binding_volume_up = KEY_VOLUMEUP
binding_volume_down = KEY_VOLUMEDOWN
binding_brightness_up = KEY_BRIGHTNESSUP
binding_brightness_down = KEY_BRIGHTNESSDOWN
binding_media-next = KEY_NEXTSONG
binding_media-prev = KEY_PREVIOUSSONG
# Additional SOTA bindings
binding_system_monitor = <super> KEY_M
binding_quick_launch = <super> KEY_R
binding_workspace_overview = <super> KEY_TAB
binding_window_overview = <super> KEY_P
# Windows-style workspace management
binding_workspace_1 = <super> KEY_1
binding_workspace_2 = <super> KEY_2
binding_workspace_3 = <super> KEY_3
binding_workspace_4 = <super> KEY_4
binding_workspace_5 = <super> KEY_5
binding_workspace_6 = <super> KEY_6
binding_workspace_7 = <super> KEY_7
binding_workspace_8 = <super> KEY_8
binding_workspace_9 = <super> KEY_9
# Note: Window movement between workspaces uses existing move plugin bindings

# SOTA Enhanced commands with WezTerm as default
command_terminal = wezterm start
command_launcher = wofi --show drun
command_browser = cachy-browser
command_filemanager = thunar
command_editor = nvim
command_lock = swaylock -e -K
command_logout = wlogout
command_media-next = playerctl next
command_media-play-pause = playerctl play-pause
command_media-prev = playerctl previous
command_media-stop = playerctl stop
command_mute = pamixer --toggle-mute
command_screenshot = grim $HOME/Pictures/screenshot-$(date "+%Y-%m-%d-%H:%M:%S").png && notify-send -i "camera" 'screenshot' 'saved in ~/Pictures'
command_screenshot_interactive = slurp | grim -g - $HOME/Pictures/slurped-$(date "+%Y-%m-%d-%H:%M:%S").png && notify-send -i "camera" 'screenshot' 'saved in ~/Pictures'
command_clipman = clipman pick -t wofi
command_volume_up = pamixer -ui 3
command_volume_down = pamixer -ud 3
command_brightness_up = brightnessctl s +5%
command_brightness_down = brightnessctl s 5%-
# Additional SOTA commands
command_system_monitor = wezterm start -- btop
command_quick_launch = wofi --show run
command_workspace_overview = expo
command_window_overview = scale
# Windows-style workspace commands
command_workspace_1 = workspace 1
command_workspace_2 = workspace 2
command_workspace_3 = workspace 3
command_workspace_4 = workspace 4
command_workspace_5 = workspace 5
command_workspace_6 = workspace 6
command_workspace_7 = workspace 7
command_workspace_8 = workspace 8
command_workspace_9 = workspace 9
# Note: Window movement between workspaces is handled by the move plugin
# Use Super + Shift + Left/Right to move windows between workspaces

[core]
background_color = \#1A1A1AFF
close_top_view = <super> KEY_Q | <alt> KEY_F4
focus_button_with_modifiers = false
focus_buttons = BTN_LEFT | BTN_MIDDLE | BTN_RIGHT
focus_buttons_passthrough = true
max_render_time = -1
# Optimized plugin list for better compatibility and stability (removed background-view to prevent crashes)
plugins = autostart command alpha animate decoration expo fast-switcher grid idle move oswitch place resize switcher vswitch window-rules wrot zoom blur wm-actions fisheye scale scale-title-filter simple-tile vswipe workspace-names
preferred_decoration_mode = client
# Workspace grid configuration
vheight = 3
vwidth = 3
xwayland = true
# Enable output persistence to prevent scaling reset
output_persistence = true

[cube]
activate = <alt> <ctrl> BTN_LEFT
background = \#1A1A1AFF
background_mode = simple
cubemap_image =
deform = 0
initial_animation = 350
light = true
rotate_left = <super> KEY_LEFT
rotate_right = <super> KEY_RIGHT
skydome_mirror = true
skydome_texture =
speed_spin_horiz = 0.020000
speed_spin_vert = 0.020000
speed_zoom = 0.070000
zoom = 0.100000

[decoration]
active_color = \#5B9BD5FF
border_size = 2
button_order = minimize maximize close
# SOTA Font configuration - Fira Code Nerd Font
font = FiraCode Nerd Font
ignore_views = none
inactive_color = \#AAAAAAFF
title_height = 24
# Enhanced decoration for modern look
title_font_size = 10
title_color = \#FFFFFFFF
title_bg_color = \#00000000

[expo]
# Enhanced workspace overview
background = \#1A1A1AFF
duration = 300
offset = 5
# Workspace selection
select_workspace_1 = KEY_1
select_workspace_2 = KEY_2
select_workspace_3 = KEY_3
select_workspace_4 = KEY_4
select_workspace_5 = KEY_5
select_workspace_6 = KEY_6
select_workspace_7 = KEY_7
select_workspace_8 = KEY_8
select_workspace_9 = KEY_9
toggle = <super> KEY_TAB

[extra-gestures]
close_fingers = 20
move_delay = 500
move_fingers = 3

[fast-switcher]
# Enhanced fast switcher for Windows-like experience
activate = <alt> KEY_ESC
activate_backward = <alt> <shift> KEY_ESC
inactive_alpha = 0.700000

[fisheye]
radius = 450.000000
toggle = <ctrl> <super> BTN_LEFT
zoom = 7.000000

[follow-focus]
change_output = true
change_view = true
focus_delay = 50
raise_on_top = true
threshold = 10

[force-fullscreen]
constrain_pointer = false
constraint_area = view
key_toggle_fullscreen = <alt> <super> KEY_F
preserve_aspect = true
transparent_behind_views = true
x_skew = 0.000000
y_skew = 0.000000

[grid]
duration = 300
# Enhanced grid with vim-style keybindings
restore = <super> KEY_DOWN | <super> KEY_KP0
slot_b = <super> KEY_KP2
slot_bl = <super> KEY_KP1
slot_br = <super> KEY_KP3
slot_c = <super> KEY_UP | <super> KEY_KP5
slot_l = <super> KEY_LEFT | <super> KEY_KP4
slot_r = <super> KEY_RIGHT | <super> KEY_KP6
slot_t = <super> KEY_KP8
slot_tl = <super> KEY_KP7
slot_tr = <super> KEY_KP9
type = crossfade

[idle]
cube_max_zoom = 1.500000
cube_rotate_speed = 1.000000
cube_zoom_speed = 1000
disable_on_fullscreen = true
dpms_timeout = -1
screensaver_timeout = 3600
toggle = none

[input]
click_method = default
cursor_size = 24
cursor_theme = capitaine-cursors
disable_touchpad_while_mouse = false
disable_touchpad_while_typing = false
gesture_sensitivity = 1.000000
kb_capslock_default_state = false
kb_numlock_default_state = false
kb_repeat_delay = 400
kb_repeat_rate = 40
middle_emulation = false
modifier_binding_timeout = 400
mouse_accel_profile = default
mouse_cursor_speed = 0.000000
mouse_scroll_speed = 1.000000
natural_scroll = false
scroll_method = default
tap_to_click = true
touchpad_accel_profile = default
touchpad_cursor_speed = 0.000000
touchpad_scroll_speed = 1.000000
# Fixed keyboard configuration to prevent layout issues
xkb_layout = us,ru
xkb_model = pc105
xkb_options = "grp:caps_toggle,grp_led:caps,altwin:swap_alt_win"
xkb_rules = evdev
xkb_variant =

[input-device]
output =

[invert]
preserve_hue = false
toggle = <super> KEY_I

[join-views]

[keycolor]
color = \#000000FF
opacity = 0.250000
threshold = 0.500000

[mag]
default_height = 500
toggle = <alt> <super> KEY_M
zoom_level = 75

[move]
activate = <super> BTN_LEFT
enable_snap = true
enable_snap_off = true
join_views = false
quarter_snap_threshold = 50
snap_off_threshold = 10
snap_threshold = 10
workspace_switch_after = -1

[oswitch]
next_output = <super> KEY_O
next_output_with_win = <shift> <super> KEY_O

[output]
# Basic output configuration for stability (prevents scaling reset on reload)
mode = auto
position = auto
scale = 1.000000
transform = normal
# Enable output persistence to prevent scaling reset
persistent_output_config = true
# Fix for HiDPI scaling issues
force_scale = false

# Additional output configurations for different displays
# Uncomment and modify as needed for your specific setup
# [output:eDP-1]
# mode = 1920x1080@60
# position = 0,0
# scale = 1.000000
# transform = normal

# [output:HDMI-A-1]
# mode = 1920x1080@60
# position = 1920,0
# scale = 1.000000
# transform = normal

[place]
mode = random

[preserve-output]
last_output_focus_timeout = 10000

[resize]
activate = <super> BTN_RIGHT

[scale]
allow_zoom = false
bg_color = \#1A1A1AE6
duration = 750
inactive_alpha = 0.750000
interact = false
middle_click_close = false
spacing = 50
text_color = \#CCCCCCFF
title_font_size = 9
title_overlay = all
title_position = center
toggle = <super> KEY_P | hotspot left-top 10x100 100
toggle_all =

[scale-title-filter]
bg_color = \#00000080
case_sensitive = false
font_size = 30
overlay = true
share_filter = false
text_color = \#CCCCCCCC

[simple-tile]
button_move = <super> BTN_LEFT
button_resize = <super> BTN_RIGHT
inner_gap_size = 8
keep_fullscreen_on_adjacent = true
# Enhanced vim-style navigation
key_focus_above = <super> KEY_K
key_focus_below = <super> KEY_J
key_focus_left = <super> KEY_H
key_focus_right = <super> KEY_L
key_toggle = <super> KEY_T
outer_horiz_gap_size = 0
outer_vert_gap_size = 0
